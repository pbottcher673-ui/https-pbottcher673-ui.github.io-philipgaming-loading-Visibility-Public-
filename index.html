<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhilippGaming Loading</title>
<link rel="stylesheet" href="style.css">
<style>#sound-button{position:fixed;right:28px;bottom:28px;z-index:5;padding:12px 18px;border:1px solid #7de7ff;background:rgba(5,14,21,.9);color:#f1fbff;font:600 16px Rajdhani,sans-serif;cursor:pointer}#sound-button:hover{background:#123b4a}#sound-button:disabled{opacity:.65;cursor:default}</style>
</head>
<body>
<video id="background-video" autoplay muted loop playsinline preload="auto">
    <source src="loading.mp4" type="video/mp4">
</video>
<button id="sound-button" type="button">Ton aktivieren</button>
<main class="screen">
<section class="welcome">
<p class="eyebrow">PHILIPPGAMING</p>
<h1>Willkommen bei Shadow Legion</h1>
<p id="player-name" class="player-name">Spieler wird geladen ...</p>
<div class="progress"><div id="progress-bar"></div></div>
<p id="status">Verbindung wird hergestellt ...</p>
</section>
<aside class="team">
<p class="eyebrow">TEAM</p>
<div><span>Projektleitung</span><b>Thombus</b></div>
<div><span>Serverleitung</span><b>PhilippGaming</b></div>
<div><span>stv. Serverleitung</span><b>Yanik</b></div>
<div><span>Community Developer</span><b>Lemon</b></div>
<div><span>Teamleitung</span><b>Rasch</b></div>
<div><span>stv. Teamleitung</span><b>Ori</b></div>
</aside>
</main>
<script src="script.js"></script>
</body>
</html>
